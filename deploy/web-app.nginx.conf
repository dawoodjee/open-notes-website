# The open-notes web app on its own subdomain (e.g. web.notes.casa).
#
# A standalone file in /etc/nginx/conf.d/: bench never writes it, so
# `bench setup nginx` leaves it alone. Fill in the three placeholders:
#   __DOMAIN__    web.notes.casa
#   __WEB_ROOT__  the folder holding the built app's index.html
#   __CERT_DIR__  /etc/letsencrypt/live/<certificate name>
#
# Why nginx and not Frappe: Frappe won't serve .js/.json/.html from www/, and the
# app's service worker must be served from the path it controls.

server {
	listen 80;
	listen [::]:80;
	server_name __DOMAIN__;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name __DOMAIN__;

	ssl_certificate     __CERT_DIR__/fullchain.pem;
	ssl_certificate_key __CERT_DIR__/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:OpenNotesWeb:10m;
	ssl_session_timeout 5m;

	root __WEB_ROOT__;

	gzip on;
	gzip_types application/javascript text/css application/json application/wasm application/manifest+json image/svg+xml;

	# An add_header inside a location replaces the server's, so each location
	# repeats the security headers.

	# Any path that isn't a file is a route inside the app.
	location / {
		try_files $uri /index.html;
		add_header X-Content-Type-Options nosniff always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=63072000" always;
		# index.html, sw.js, the manifest: always revalidate, so a new deploy is seen.
		add_header Cache-Control "no-cache" always;
	}

	# Content-hashed bundles never change under the same name.
	location ^~ /_expo/ {
		try_files $uri =404;
		add_header X-Content-Type-Options nosniff always;
		add_header Strict-Transport-Security "max-age=63072000" always;
		# No `always`: a 404 must not be cached for a year.
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Older nginx (e.g. Ubuntu 22.04's 1.18) has no wasm type, and a database
	# engine served as octet-stream can't be compiled while it downloads.
	location ~ \.wasm$ {
		types { }
		default_type application/wasm;
		try_files $uri =404;
		add_header X-Content-Type-Options nosniff always;
		add_header Strict-Transport-Security "max-age=63072000" always;
		add_header Cache-Control "no-cache" always;
	}

	location ~ \.webmanifest$ {
		types { }
		default_type application/manifest+json;
		try_files $uri =404;
		add_header X-Content-Type-Options nosniff always;
		add_header Strict-Transport-Security "max-age=63072000" always;
		add_header Cache-Control "no-cache" always;
	}
}
