# The open-notes web app at /web. Installed by apply_web_nginx.py from the
# open_notes_website app; bench never writes this file, so it survives
# `bench setup nginx`. Only the one `include` line in bench's config has to be
# re-added after a regeneration (re-run the script).
#
# Why nginx and not Frappe: Frappe won't serve .js/.json/.html from www/, and a
# service worker can only control the path it's served from, so the app needs a
# plain folder at /web.

location = /web {
	return 301 /web/;
}

location ^~ /web/ {
	root __WEB_PARENT__;

	# Any path that isn't a file is a route inside the app.
	try_files $uri /web/index.html;

	# An add_header here replaces the server's own, so the ones that matter are
	# repeated in every location below.
	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin" always;
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
	# index.html, sw.js, the manifest: always revalidate, so a new deploy is seen.
	add_header Cache-Control "no-cache" always;

	# Content-hashed bundles never change under the same name.
	location ^~ /web/_expo/ {
		try_files $uri =404;
		add_header X-Content-Type-Options nosniff always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
		# No `always`: a 404 must not be cached for a year.
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Older nginx (e.g. Ubuntu 22.04's 1.18) has no wasm type, and a database
	# engine served as octet-stream can't be compiled while it downloads.
	location ~ \.wasm$ {
		types { }
		default_type application/wasm;
		try_files $uri =404;
		add_header X-Content-Type-Options nosniff always;
		add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
		add_header Cache-Control "no-cache" always;
	}

	location ~ \.webmanifest$ {
		types { }
		default_type application/manifest+json;
		try_files $uri =404;
		add_header X-Content-Type-Options nosniff always;
		add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
		add_header Cache-Control "no-cache" always;
	}
}
